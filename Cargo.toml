[package]
name = "breakout-native"
version = "1.0.0"
authors = ["Canmi <t@canmi.icu>"]
edition = "2024"
license = "MIT"
publish = false
rust-version = "1.95"

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
ndarray = "0.17"
numpy = "0.28"
pyo3 = { version = "0.28", features = ["extension-module", "abi3-py311"] }
rand = "0.10"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev]
opt-level = 0
codegen-units = 256
