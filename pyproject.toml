[project]
name = "breakout"
version = "1.0.0"
description = "Atari Breakout DQN agent"
requires-python = ">=3.11,<3.14"
dependencies = [
	"gymnasium[atari,other]>=1.1",
	"ale-py>=0.10",
	"torch>=2.6",
	"numpy>=2.0",
	"matplotlib>=3.10",
	"pygame>=2.6",
	"tqdm>=4.66",
	"jupytext>=1.19.1",
	"nbconvert>=7.17.1",
	"ipykernel>=7.2.0",
]

[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[tool.maturin]
python-source = "."
module-name = "breakout._native"
features = ["pyo3/extension-module"]

[dependency-groups]
dev = ["maturin>=1.5,<2.0"]
