[project]
name = "breakout"
version = "0.1.0"
description = "Atari Breakout DQN agent"
requires-python = ">=3.11"
dependencies = [
	"gymnasium[atari]>=1.1",
	"ale-py>=0.10",
	"torch>=2.6",
	"numpy>=2.0",
	"matplotlib>=3.10",
	"pygame>=2.6",
]

[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[tool.maturin]
python-source = "."
module-name = "breakout._native"
features = ["pyo3/extension-module"]

[dependency-groups]
dev = ["maturin>=1.5,<2.0"]
